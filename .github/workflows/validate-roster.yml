name: Validate roster sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Validate live dated memberships
        env:
          LEGISTAR_TOKEN: ${{ secrets.LEGISTAR_TOKEN }}
        run: |
          uv run --no-project --with httpx --with beautifulsoup4 python - <<'PYROSTER'
          from datetime import date
          from pipeline.roster import current_roster
          rows = current_roster(date.today().isoformat(), force_refresh=True)
          print(f"Validated {len(rows)} dated Council district memberships")
          PYROSTER
